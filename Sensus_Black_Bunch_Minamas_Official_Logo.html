<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensus Black Bunch | Minamas Plantation</title>
<meta name="theme-color" content="#174a32">
<meta name="description" content="Aplikasi pencatatan sensus black bunch per pokok untuk operasional agronomi.">
<style>
:root{--g:#174a32;--g2:#226443;--g3:#e7f2eb;--gold:#e2b43b;--bg:#f4f6f2;--card:#fff;--ink:#18251e;--mute:#68766d;--line:#dce5dd;--bb:#282d2a;--red:#b52c3b;--shadow:0 8px 24px rgba(22,57,37,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
header{background:linear-gradient(125deg,#123d2a,#1b5a3b 70%,#276747);color:#fff;padding:calc(15px + env(safe-area-inset-top)) 16px 0;border-bottom:4px solid var(--gold);box-shadow:0 4px 18px #0c2f201a}
.brand{display:flex;align-items:center;gap:12px;margin:0 auto 13px;max-width:720px}.logo{background:#fff;border-radius:10px;padding:3px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px #001c0d24;width:76px;height:72px;overflow:hidden}.logo img{display:block;width:100%;height:100%;object-fit:contain}.brand-copy{min-width:0}.brand h1{margin:0;font-size:clamp(18px,4vw,22px);font-weight:750;letter-spacing:-.35px;line-height:1.2}.brand p{margin:4px 0 0;font-size:12px;opacity:.82;letter-spacing:.15px}
nav{display:flex;gap:5px;max-width:720px;margin:auto}nav button{flex:1;background:none;border:0;color:#e5efe8;opacity:.86;padding:12px 5px 11px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}nav button.on{opacity:1;color:#fff;border-bottom-color:var(--gold)}
main{padding:16px 13px;max-width:720px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}h2{margin:0 0 12px;font-size:17px;letter-spacing:-.2px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:var(--g2);margin-bottom:5px}
label{display:block;font-size:12px;color:var(--mute);font-weight:650;margin:12px 0 5px}input,select{width:100%;padding:12px 13px;border:1px solid #cbd7ce;border-radius:10px;font-size:16px;background:#fff;color:var(--ink);min-height:46px;outline:none}input:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 3px #2264431b}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}button{font-family:inherit;cursor:pointer}button.btn{width:100%;padding:13px 14px;border:0;border-radius:10px;font-size:15px;font-weight:700;background:var(--g);color:#fff;margin-top:10px;min-height:46px;transition:transform .08s,background .15s}button.btn:active{transform:scale(.99)}button.btn:hover{background:#103d29}button.btn.alt{background:#fff;color:var(--g);border:1px solid #a9c4b1}button.btn.red{background:#fff;color:var(--red);border:1px solid #e5b8bd}button.btn:disabled{opacity:.42;cursor:not-allowed}
.big{font-size:clamp(42px,12vw,58px);font-weight:800;text-align:center;padding:10px 8px 14px;letter-spacing:-2px;color:var(--g);line-height:1.15}.count-input{font-size:32px!important;font-weight:750;text-align:center;min-height:62px;background:#fbfdfb}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:650;background:#edf1ed;color:#56635a}.pill.ok{background:#dff3e5;color:#17643a}.pill.bad{background:#fde9e7;color:#a52d2d}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}.stats div{background:#f4f7f4;border:1px solid #edf1ed;border-radius:11px;padding:11px 5px}.stats b{display:block;font-size:clamp(19px,5vw,24px);line-height:1.25;color:var(--g);overflow-wrap:anywhere}.stats span{display:block;font-size:11px;color:var(--mute);margin-top:4px}.grid{display:flex;flex-wrap:wrap;gap:6px}.chip{min-width:43px;padding:7px 7px;border-radius:8px;text-align:center;font-size:14px;font-weight:700;background:#edf3ee;color:#234d34}.chip small{display:block;font-size:9px;font-weight:600;color:var(--mute);margin-bottom:2px}.chip.v1{background:#fff0c4;color:#70520b}.chip.v3{background:#f5d4c8;color:#813b28}.chip.v5{background:var(--bb);color:#fff}.chip.v5 small{color:#d5d5d5}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--mute);font-weight:750;text-transform:uppercase;letter-spacing:.3px}tr[onclick]{cursor:pointer}tr[onclick]:hover{background:#f5f8f5}.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.msg{font-size:13px;color:var(--red);min-height:18px;margin-top:7px}.muted{color:var(--mute);font-size:12px}.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px}.bar i{display:block;height:13px;background:var(--g2);border-radius:4px;min-width:2px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.hint{background:#f3f8f4;border:1px solid #e1eee4;border-radius:10px;padding:10px 12px;color:#4c6655;font-size:12px;margin-top:10px}.hero-label{display:flex;align-items:center;justify-content:space-between;gap:8px}.field-meta{font-size:12px;color:var(--mute);line-height:1.6}.footer-note{text-align:center;color:#8a958d;font-size:10px;padding:4px 0 12px}
@media(min-width:560px){main{padding:20px 16px}.card{padding:19px;margin-bottom:15px}.row{gap:12px}}
@media(max-width:380px){.brand{gap:8px}.logo{padding:5px}.logo svg{width:105px}.brand h1{font-size:17px}.brand p{font-size:11px}.card{padding:13px}.stats{gap:5px}.stats div{padding:9px 3px}}
</style>
</head>

      <h1>Sensus Black Bunch</h1>
      <p>Sensus agronomi • Hitung tandan hitam per pokok</p>

  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="footer-note">SENSUS BLACK BUNCH · MINAMAS PLANTATION</div>

<script>
// Database field (opsional). Salin dari tools AKP: {kode:'A01', tt:'2012', sph:136, luas:30.5}
const FIELDS = [];

const KEY = 'bb_sensus_v1';
let S = load();
let tab = 'sensus';
let view = null;        // id sensus yang sedang dilihat di tab Data
let gps = {lat:null,lng:null,acc:null,err:''};
let watchId = null;
let msg = '';

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d) return d; }catch(e){}
  return {settings:{acc:7,gps:true},draft:null,records:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = n => (isFinite(n)?n:0).toLocaleString('id-ID',{maximumFractionDigits:2});
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function startGPS(){
  if(watchId!==null || !S.settings.gps || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(p=>{
    gps = {lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,err:''};
    updGps();
  },e=>{ gps.err = 'GPS tidak tersedia: izinkan lokasi di browser'; updGps(); },
  {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
function stopGPS(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
function gpsOk(){ return !S.settings.gps || !!gps.err || (gps.acc!==null && gps.acc<=S.settings.acc); }
function updGps(){
  const el = $('#gps'); if(!el) return;
  if(!S.settings.gps){ el.className='pill'; el.textContent='GPS mati'; }
  else if(gps.err){ el.className='pill'; el.textContent='GPS tidak aktif, koordinat tidak dicatat'; }
  else if(gps.acc===null){ el.className='pill'; el.textContent='Mencari sinyal GPS...'; }
  else { el.className='pill '+(gpsOk()?'ok':'bad'); el.textContent='GPS ±'+Math.round(gps.acc)+' m'+(gpsOk()?'':' (maks '+S.settings.acc+' m)'); }
  const b = $('#saveBtn'); if(b) b.disabled = !gpsOk();
  const z = $('#zeroBtn'); if(z) z.disabled = !gpsOk();
}

function stats(pokok){
  const n = pokok.length, tot = pokok.reduce((a,p)=>a+p.bb,0);
  const ada = pokok.filter(p=>p.bb>0).length;
  return {n,tot,ada,avg:n?tot/n:0,pct:n?ada/n*100:0,max:pokok.reduce((a,p)=>Math.max(a,p.bb),0)};
}
const cls = v => v>=5?'v5':v>=3?'v3':v>=1?'v1':'';

function render(){
  $('#nav').innerHTML = [['sensus','Sensus'],['data','Data'],['set','Pengaturan']]
    .map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
  const a = $('#app');
  if(tab==='sensus') a.innerHTML = S.draft ? countingHTML() : startHTML();
  else if(tab==='data') a.innerHTML = view ? detailHTML(S.records.find(r=>r.id===view)) : listHTML();
  else a.innerHTML = settingsHTML();
  if(tab==='sensus' && S.draft){ startGPS(); updGps(); const i=$('#bb'); if(i) i.focus(); }
}
function go(t){ tab=t; view=null; msg=''; render(); }

/* ---------- Mulai ---------- */
function startHTML(){
  return `<div class="card"><div class="eyebrow">Pencatatan lapangan</div><h2>Mulai sensus</h2>
  <label>Field / Blok</label>
  <input id="kode" list="fl" placeholder="Contoh: A01" oninput="fillField()">
  <datalist id="fl">${FIELDS.map(f=>`<option value="${esc(f.kode)}">`).join('')}</datalist>
  <div class="row"><div><label>Tahun tanam</label><input id="tt" inputmode="numeric"></div>
  <div><label>SPH (pokok/ha)</label><input id="sph" inputmode="decimal"></div></div>
  <div class="row"><div><label>Luas (ha)</label><input id="luas" inputmode="decimal"></div>
  <div><label>Tanggal</label><input id="tgl" type="date" value="${today()}"></div></div>
  <div class="msg">${esc(msg)}</div>
  <button class="btn" onclick="startSensus()">Mulai sensus</button></div>`;
}
function fillField(){
  const f = FIELDS.find(x=>x.kode===$('#kode').value.trim()); if(!f) return;
  $('#tt').value=f.tt??''; $('#sph').value=f.sph??''; $('#luas').value=f.luas??'';
}
function startSensus(){
  const kode=$('#kode').value.trim(), sph=parseFloat($('#sph').value.replace(',','.')), luas=parseFloat($('#luas').value.replace(',','.'));
  if(!kode){ msg='Isi field terlebih dahulu.'; return render(); }
  S.draft = {id:Date.now(),tgl:$('#tgl').value||today(),kode,tt:$('#tt').value.trim(),sph:isFinite(sph)?sph:0,luas:isFinite(luas)?luas:0,pokok:[]};
  msg=''; save(); render();
}

/* ---------- Hitung ---------- */
function countingHTML(){
  const d=S.draft, s=stats(d.pokok);
  const last = d.pokok.slice(-6).reverse();
  return `<div class="card"><div class="eyebrow">Mode pencatatan aktif</div><div class="muted">Field ${esc(d.kode)}${d.tt?' · TT '+esc(d.tt):''} · ${esc(d.tgl)}</div>
  <div class="big">Pokok ${d.pokok.length+1}</div>
  <label>Jumlah black bunch pokok ini</label>
  <input id="bb" class="count-input" type="number" inputmode="numeric" min="0" max="99" step="1" placeholder="0" aria-label="Jumlah black bunch" enterkeyhint="next" onkeydown="if(event.key==='Enter'||event.keyCode===13){event.preventDefault();addPokok()}">
  <div class="row" style="margin-top:12px"><button class="btn" id="saveBtn" onclick="addPokok()" style="margin:0">Simpan, lanjut</button>
  <button class="btn alt" id="zeroBtn" onclick="addPokok(0)" style="margin:0">Simpan 0</button></div>
  <div style="margin-top:10px"><span id="gps" class="pill">GPS</span></div><div class="hint">Masukkan jumlah tandan hitam pada pokok ini. Gunakan <b>Simpan 0</b> jika tidak ditemukan. Pastikan nomor pokok mengikuti urutan sensus.</div>
  <div class="msg" id="m">${esc(msg)}</div></div>
  <div class="card"><div class="stats"><div><b>${s.n}</b><span>Pokok</span></div><div><b>${s.tot}</b><span>Total BB</span></div><div><b>${f1(s.avg)}</b><span>Rata-rata/pokok</span></div></div>
  ${last.length?`<div class="grid" style="margin-top:12px">${last.map((p,i)=>`<div class="chip ${cls(p.bb)}"><small>${d.pokok.length-i}</small>${p.bb}</div>`).join('')}</div>`:''}
  <button class="btn alt" onclick="undo()" ${d.pokok.length?'':'disabled'}>Hapus pokok terakhir</button>
  <button class="btn" onclick="finish()" ${d.pokok.length?'':'disabled'}>Selesai dan lihat hasil</button>
  <button class="btn red" onclick="cancelDraft()">Batalkan sensus</button></div>`;
}
function addPokok(forced){
  const i=$('#bb'); let v = forced!==undefined ? forced : parseInt(i.value,10);
  if(!Number.isInteger(v) || v<0){ msg='Ketik angka 0 atau lebih.'; return $('#m').textContent=msg; }
  if(v>99){ msg='Angka terlalu besar, periksa lagi.'; return $('#m').textContent=msg; }
  if(!gpsOk()){ updGps(); msg='Tunggu GPS sampai akurasi ±'+S.settings.acc+' m, lalu simpan lagi.'; return $('#m').textContent=msg; }
  S.draft.pokok.push({bb:v,lat:gps.lat,lng:gps.lng,acc:gps.acc});
  msg=''; save(); render();
}
function undo(){ S.draft.pokok.pop(); save(); render(); }
function cancelDraft(){ if(confirm('Batalkan sensus ini? Data pokok akan hilang.')){ S.draft=null; save(); stopGPS(); render(); } }
function finish(){
  const d=S.draft; S.records.unshift(d); S.draft=null; save(); stopGPS();
  tab='data'; view=d.id; render();
}

/* ---------- Data ---------- */
function listHTML(){
  if(!S.records.length) return `<div class="card"><div class="eyebrow">Ringkasan data</div><h2>Belum ada data sensus</h2><p class="muted">Selesaikan satu sensus di tab Sensus. Rekap dan analisis akan muncul di halaman ini.</p><button class="btn" onclick="go('sensus')">Mulai sensus pertama</button></div>`;
  const allPokok=S.records.reduce((n,r)=>n+r.pokok.length,0), allBB=S.records.reduce((n,r)=>n+stats(r.pokok).tot,0);
  return `<div class="card"><div class="eyebrow">Ringkasan operasional</div><h2>Rekap sensus</h2><div class="stats" style="margin-bottom:14px"><div><b>${S.records.length}</b><span>Sensus selesai</span></div><div><b>${allPokok.toLocaleString('id-ID')}</b><span>Pokok tercatat</span></div><div><b>${allBB.toLocaleString('id-ID')}</b><span>Total BB</span></div></div>
  <table><tr><th>Tanggal</th><th>Field</th><th>Pokok</th><th>Total BB</th><th>Rata²</th></tr>
  ${S.records.map(r=>{const s=stats(r.pokok);return `<tr onclick="view=${r.id};render()"><td>${esc(r.tgl)}</td><td><b>${esc(r.kode)}</b></td><td>${s.n}</td><td>${s.tot}</td><td>${f1(s.avg)}</td></tr>`}).join('')}</table>
  <button class="btn" onclick="csvRekap()">Unduh rekap CSV</button></div>`;
}
function detailHTML(r){
  if(!r){ view=null; return listHTML(); }
  const s=stats(r.pokok);
  const bins=[['0',v=>v===0],['1',v=>v===1],['2',v=>v===2],['3–4',v=>v>=3&&v<=4],['5+',v=>v>=5]];
  const cnt=bins.map(([l,f])=>[l,r.pokok.filter(p=>f(p.bb)).length]);
  const mx=Math.max(1,...cnt.map(c=>c[1]));
  const bbHa = s.avg*r.sph, bbField = bbHa*r.luas;
  return `<div class="card"><button class="btn alt" style="margin:0 0 12px" onclick="view=null;render()">Kembali ke rekap</button>
  <h2>Field ${esc(r.kode)}</h2><div class="muted">${esc(r.tgl)}${r.tt?' · TT '+esc(r.tt):''} · SPH ${f1(r.sph)} · Luas ${f1(r.luas)} ha</div>
  <div class="stats" style="margin-top:12px"><div><b>${s.n}</b><span>Pokok sampel</span></div><div><b>${s.tot}</b><span>Total BB</span></div><div><b>${f1(s.avg)}</b><span>BB / pokok</span></div></div>
  <div class="stats" style="margin-top:8px"><div><b>${s.ada}</b><span>Pokok ada BB</span></div><div><b>${f1(s.pct)}%</b><span>% pokok ada BB</span></div><div><b>${s.max}</b><span>BB terbanyak</span></div></div></div>
  <div class="card"><h2>Estimasi</h2>
  <table><tr><td>BB per hektar</td><td><b>${f1(bbHa)}</b></td></tr><tr><td>BB seluruh field</td><td><b>${f1(bbField)}</b></td></tr></table>
  <div class="muted" style="margin-top:6px">Rata-rata BB per pokok × SPH × luas field.</div></div>
  <div class="card"><h2>Sebaran BB per pokok</h2>
  ${cnt.map(([l,c])=>`<div class="bar"><span style="width:30px">${l}</span><i style="width:${c/mx*60}%"></i><span>${c}</span></div>`).join('')}</div>
  <div class="card"><h2>Letak pokok</h2><div class="grid">${r.pokok.map((p,i)=>`<div class="chip ${cls(p.bb)}"><small>${i+1}</small>${p.bb}</div>`).join('')}</div>
  <button class="btn" onclick="csvPokok(${r.id})">Unduh data pokok CSV</button>
  <button class="btn red" onclick="delRec(${r.id})">Hapus sensus ini</button></div>`;
}
function delRec(id){ if(confirm('Hapus sensus ini?')){ S.records=S.records.filter(r=>r.id!==id); save(); view=null; render(); } }

/* ---------- Pengaturan ---------- */
function settingsHTML(){
  return `<div class="card"><div class="eyebrow">Preferensi aplikasi</div><h2>Pengaturan</h2>
  <label>Batas akurasi GPS (meter)</label><input id="acc" type="number" inputmode="numeric" value="${S.settings.acc}">
  <label>GPS per pokok</label><select id="gpsOn"><option value="1" ${S.settings.gps?'selected':''}>Aktif</option><option value="0" ${S.settings.gps?'':'selected'}>Mati</option></select>
  <button class="btn" onclick="saveSet()">Simpan pengaturan</button><div class="hint"><b>Catatan penyimpanan:</b> versi ini menyimpan data di browser/perangkat yang digunakan. Data belum otomatis terkirim ke server perusahaan atau dibagikan ke pengguna lain. Untuk operasional resmi, diperlukan backend/database dan mekanisme sinkronisasi yang disetujui IT perusahaan.</div></div>`;
}
function saveSet(){
  const a=parseFloat($('#acc').value); if(a>0) S.settings.acc=a;
  S.settings.gps = $('#gpsOn').value==='1'; if(!S.settings.gps) stopGPS();
  save(); alert('Pengaturan tersimpan'); }

/* ---------- CSV ---------- */
function dl(name,rows){
  const t = rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  try{
    const blob = new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ alert('Unduh CSV gagal pada browser ini.'); }
}
function csvRekap(){
  dl('rekap-black-bunch.csv',[['Tanggal','Field','TT','SPH','Luas (ha)','Pokok','Total BB','BB/pokok','Pokok ada BB','% ada BB','BB/ha','BB field']]
    .concat(S.records.map(r=>{const s=stats(r.pokok);return [r.tgl,r.kode,r.tt,r.sph,r.luas,s.n,s.tot,s.avg.toFixed(2),s.ada,s.pct.toFixed(1),(s.avg*r.sph).toFixed(1),(s.avg*r.sph*r.luas).toFixed(0)]})));
}
function csvPokok(id){
  const r=S.records.find(x=>x.id===id);
  dl(`black-bunch-${r.kode}-${r.tgl}.csv`,[['Tanggal','Field','Pokok ke','BB','Lat','Lng','Akurasi (m)']]
    .concat(r.pokok.map((p,i)=>[r.tgl,r.kode,i+1,p.bb,p.lat,p.lng,p.acc!=null?Math.round(p.acc):''])));
}

render();
</script>
</body>
